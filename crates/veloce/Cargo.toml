[package]
name = "veloce-tui"
version = "0.1.0"
edition = "2021"
description = "A Rust terminal-UI application framework: stack router, taffy flexbox, async hydration, and a crash-resilient runtime"
readme = "../../README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RavaniRoshan/veloce"
homepage = "https://veloce-alpha-steel.vercel.app/"
keywords = ["tui", "terminal", "framework", "ratatui", "async"]
categories = ["command-line-interface", "asynchronous"]

[dependencies]
tokio = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
taffy = { workspace = true }
crossbeam-channel = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dependencies.veloce-core]
version = "0.1.0"
path = "../veloce-core"

[dependencies.veloce-layout]
version = "0.1.0"
path = "../veloce-layout"

[dependencies.veloce-render]
version = "0.1.0"
path = "../veloce-render"

[dependencies.veloce-router]
version = "0.1.0"
path = "../veloce-router"

[dependencies.veloce-runtime]
version = "0.1.0"
path = "../veloce-runtime"

[dev-dependencies]
expectrl = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies.criterion]
workspace = true

[[bench]]
name = "frame"
harness = false


[dev-dependencies.assert_cmd]
workspace = true
