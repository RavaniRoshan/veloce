[package]
name = "veloce"
version = "0.1.0"
edition = "2021"
description = "Veloce terminal-UI framework (veloce)"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
taffy = { workspace = true }
crossbeam-channel = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dependencies.veloce-core]
version = "0.1.0"
path = "../veloce-core"

[dependencies.veloce-layout]
version = "0.1.0"
path = "../veloce-layout"

[dependencies.veloce-render]
version = "0.1.0"
path = "../veloce-render"

[dependencies.veloce-router]
version = "0.1.0"
path = "../veloce-router"

[dependencies.veloce-runtime]
version = "0.1.0"
path = "../veloce-runtime"

[dev-dependencies]
expectrl = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies.criterion]
workspace = true

[[bench]]
name = "frame"
harness = false


[dev-dependencies.assert_cmd]
workspace = true
